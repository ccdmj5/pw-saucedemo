name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test
      continue-on-error: true

    - name: Upload Playwright HTML report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Load gh-pages history
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Install Allure CLI
      if: always()
      run: |
        curl -sLo allure.tgz https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
        tar -zxf allure.tgz
        sudo mv allure-2.27.0 /opt/allure
        echo "/opt/allure/bin" >> $GITHUB_PATH

    - name: Copy Allure history from previous run
      if: always()
      run: |
        if [ -d "gh-pages/history" ]; then
          mkdir -p allure-results/history
          cp -r gh-pages/history/. allure-results/history/
        fi

    - name: Build Allure report
      if: always()
      run: |
        allure generate allure-results --clean -o allure-report
        touch allure-report/.nojekyll

    - name: Save history for next run
      if: always()
      run: |
        mkdir -p allure-report/last-history
        cp -r allure-report/history/. allure-report/last-history/

    - name: Publish to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-report