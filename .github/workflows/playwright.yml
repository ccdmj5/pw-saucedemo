name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      continue-on-error: true
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Load test report history
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages
    - name: Install Allure CLI
      if: always()
      run: |
        curl -sLo allure.tgz https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
        tar -zxf allure.tgz
        sudo mv allure-2.27.0 /opt/allure
        echo "/opt/allure/bin" >> $GITHUB_PATH
    - name: Build test report
      if: always()
      run: |
        allure generate allure-results --clean -o allure-report
        mkdir -p allure-history
        # Copy previous runs history if it exists
        if [ -d "gh-pages" ] && [ "$(ls -A gh-pages 2>/dev/null)" ]; then
          cp -r gh-pages/. allure-history/
        fi
        # Determine next run number
        LAST=$(ls allure-history 2>/dev/null | grep -E '^[0-9]+$' | sort -n | tail -1)
        NEXT=$((${LAST:-0} + 1))
        mkdir -p allure-history/$NEXT
        cp -r allure-report/. allure-history/$NEXT/
        cp -r allure-report/. allure-history/last-history/ 2>/dev/null || true
        cp allure-history/$NEXT/index.html allure-history/index.html 2>/dev/null || \
          cp allure-report/index.html allure-history/index.html
    - name: Publish test report
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history